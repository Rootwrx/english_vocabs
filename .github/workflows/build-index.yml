name: build-index
on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-index          # uploads in quick succession run one at a time
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build index.json and search.json
        id: build
        run: python make_index.py
        continue-on-error: true       # invalid lists are skipped; the others are still indexed
      - name: Commit indexes
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A data
          git diff --cached --quiet || (git commit -m "update list index" && git pull --rebase && git push)
      - name: Fail if a list file is invalid
        if: steps.build.outcome == 'failure'
        run: |
          echo "One or more list files are invalid; see the error annotations above. Valid lists were still indexed."
          exit 1
