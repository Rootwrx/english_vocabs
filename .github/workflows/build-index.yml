name: build-index
on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-index          # uploads in quick succession run one at a time
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python make_index.py
      - run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add data/index.json data/search.json
          git diff --cached --quiet || (git commit -m "update list index" && git pull --rebase && git push)
